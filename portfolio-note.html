<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Portfolio Reviewer</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: #f6f7f9; color: #1f2328;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    [hidden] { display: none !important; }
    #note { min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 640px; margin: 24px; padding: 32px; background: #fff; border-radius: 16px;
           box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
    h1 { font-size: 24px; margin: 0 0 12px; }
    blockquote { margin: 16px 0; padding: 12px 16px; background: #fff8e1; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    .muted { color: #6b7280; }
    #view { display: flex; flex-direction: column; height: 100vh; }
    #bar { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: #fff;
           border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    #who { font-weight: 600; }
    #own { margin-left: auto; padding: 4px 10px; border: 1px solid #d0d7de; border-radius: 8px;
           color: #1f2328; text-decoration: none; white-space: nowrap; }
    #own:hover { background: #f6f7f9; }
    #tip { padding: 2px 12px 4px; font-size: 12px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    #frame { flex: 1; width: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>
  <div id="note">
    <main>
      <h1 id="head">No portfolio link</h1>
      <blockquote id="text" hidden></blockquote>
      <p class="muted" id="hint">Say “N/A” or “skip”, or rate them from what they wrote.</p>
    </main>
  </div>
  <div id="view" hidden>
    <div id="bar">
      <span id="who"></span>
      <span class="muted" id="what"></span>
      <a id="own" target="_blank" rel="noopener noreferrer">Open in its own tab ↗</a>
    </div>
    <div class="muted" id="tip">Stays blank? That site doesn’t allow being shown inside another page: use “Open in its own tab”.</div>
    <iframe id="frame" title="Portfolio" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
<script>
// The Portfolio Reviewer's own page in the portfolio tab. It shows:
//  - { done }                      "All caught up"
//  - { name, text }                an applicant who gave no link, with what they wrote
//  - { name, number, show, embed } a portfolio inside this page (embed is the site's embeddable
//                                  address). Sites like Google Drive and Instagram cut the tab's
//                                  link back to the sidebar when opened directly; inside this page
//                                  they can't, so the sidebar keeps using the same tab.
// Everything comes after the "#" in the address, which browsers never send to a server.
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var safe = function (u) { return typeof u === 'string' && /^https?:\/\//i.test(u) ? u : ''; };

  function render() {
    var data = {};
    try { data = JSON.parse(decodeURIComponent(location.hash.slice(1))) || {}; } catch (e) { data = {}; }
    var show = safe(data.show);
    var embed = safe(data.embed) || show;
    $('note').hidden = !!show;
    $('view').hidden = !show;
    if (show) {
      $('who').textContent = (data.name || 'Applicant') + (data.number ? ' · #' + data.number : '');
      var host = '';
      try { host = new URL(show).hostname.replace(/^www\./, ''); } catch (e) { host = ''; }
      $('what').textContent = data.label || host;
      $('own').href = show;
      if ($('frame').getAttribute('src') !== embed) $('frame').setAttribute('src', embed);
      document.title = (data.name || 'Portfolio') + ' · ' + (host || 'portfolio');
      return;
    }
    if ($('frame').getAttribute('src')) $('frame').setAttribute('src', 'about:blank');
    var head = $('head');
    var text = $('text');
    var hint = $('hint');
    if (data.done) {
      head.textContent = 'All caught up 🎉';
      text.hidden = true;
      hint.textContent = 'No unreviewed applicants left in this direction.';
      document.title = 'All caught up';
      return;
    }
    head.textContent = (data.name || 'This applicant') + ' didn’t give a portfolio link';
    document.title = 'No link · ' + (data.name || 'applicant');
    text.hidden = !data.text;
    text.textContent = data.text ? 'They wrote: “' + data.text + '”' : '';
    hint.textContent = 'Say “N/A” or “skip”, or rate them from what they wrote.';
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
