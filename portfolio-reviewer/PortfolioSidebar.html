<!DOCTYPE html>
<html>
<head>
  <base target="_blank">
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb; --bg: #fafafa;
      --yellow: #ffe599; --green: #b6d7a8; --grey: #eceff1; --accent: #1a73e8; --danger: #c5221f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; font: 13px/1.4 "Google Sans", Roboto, Arial, sans-serif; color: var(--ink); }
    .row { display: flex; gap: 6px; align-items: center; }
    .between { justify-content: space-between; }
    .muted { color: var(--muted); }
    .small { font-size: 11px; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; white-space: nowrap; }
    h1 { font-size: 13px; margin: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-top: 10px; background: #fff; }
    .name { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
    button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 10px; cursor: pointer; color: var(--ink); }
    button:hover { filter: brightness(.97); }
    button:disabled { opacity: .5; cursor: default; }
    .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    .primary.attn { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(26, 115, 232, .25); } }
    #bOpen { width: 100%; padding: 10px; }
    .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button { flex: 1; border: 0; border-radius: 0; padding: 6px 8px; font-size: 12px; white-space: nowrap; }
    .seg button.on { background: var(--accent); color: #fff; }
    #viewerState { margin-top: 4px; }
    #viewerState.err { color: var(--danger); }
    .links { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
    .links a { color: var(--accent); text-decoration: none; font-size: 12px; word-break: break-all; }
    .links a.cur { font-weight: 700; }
    .links a.cur::before { content: '▶ '; }
    .ptext { margin-top: 6px; font-size: 12px; background: #fff8e1; border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; word-break: break-word; }
    .ptext:empty, #notes:empty { display: none; }
    #notes { white-space: pre-wrap; font-size: 12px; color: #374151; background: var(--bg); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
    .about { font-size: 12px; white-space: pre-wrap; margin-top: 4px; color: #374151; }
    .rate { display: grid; gap: 6px; margin-top: 10px; }
    .rate button { padding: 10px 4px; font-weight: 600; }
    .rate small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
    .c-next { background: var(--grey); }
    .c-good { background: var(--yellow); border-color: #f1c232; }
    .c-peak { background: var(--green); border-color: #6aa84f; }
    .c-na { background: #ea9999; border-color: #cc4125; }
    .progress { margin-top: 8px; padding: 6px 8px; border-radius: 8px; background: var(--bg); font-size: 11px; color: #374151; }
    .progress div + div { margin-top: 2px; }
    #others { background: #fef7e0; color: #8a5a00; }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; align-items: center; }
    .tabs .lbl { font-size: 11px; color: var(--muted); margin-right: 2px; }
    .tabs button { font-size: 11px; padding: 3px 8px; border-radius: 999px; }
    .tabs button.fit { border-color: #9aa0a6; }
    .tabs button.pending { background: #e8f0fe; border-color: var(--accent); color: #174ea6; font-weight: 600; }
    .tabs button.done { background: #e6f4ea; border-color: #34a853; color: #137333; font-weight: 600; }
    textarea { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px; resize: vertical; min-height: 44px; }
    #status { margin-top: 10px; font-size: 12px; min-height: 18px; }
    #status.err { color: var(--danger); }
    .voice { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; flex: none; }
    .dot.on { background: #34a853; }
    kbd { font: 11px ui-monospace, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
    details { margin-top: 10px; }
    summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    table.cmds { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 6px; }
    table.cmds td { padding: 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.cmds td:first-child { font-weight: 600; white-space: nowrap; padding-right: 8px; }
  </style>
</head>
<body>
  <div class="row between">
    <h1 id="title">Loading…</h1>
    <span class="pill" id="remaining">–</span>
  </div>
  <div class="row" style="margin-top:4px"><span class="pill" id="others" hidden></span></div>
  <div class="progress" id="progress">
    <div id="progToday">Today: –</div>
    <div id="progMe"></div>
  </div>

  <div style="margin-top:10px">
    <button id="bOpen" class="primary">🖼️ Open portfolio <kbd style="color:inherit;background:transparent">O</kbd></button>
    <div class="row" style="margin-top:6px">
      <span class="dot" id="viewerDot" title="Portfolio window"></span>
      <div class="seg" style="flex:1">
        <button id="vTab" title="Portfolios open in a new browser tab">New tab</button>
        <button id="vPopup" title="Portfolios open in a separate window beside this one">Popup window</button>
      </div>
    </div>
    <div class="muted small" id="viewerState">Click “Open portfolio” once. After that, every rating opens the next portfolio in the same tab.</div>
  </div>

  <div class="seg" style="margin-top:8px">
    <button id="dirDown" title="Work top → bottom">↓ Top → bottom</button>
    <button id="dirUp" title="Work bottom → top">↑ Bottom → top</button>
  </div>

  <div class="card">
    <div class="name" id="name">–</div>
    <div class="muted small" id="meta"></div>
    <div class="links" id="links"></div>
    <div class="ptext" id="ptext"></div>
    <div id="notes"></div>
    <details id="aboutBox"><summary>About them</summary><div class="about" id="about"></div></details>
  </div>

  <div class="rate" id="rate"></div>
  <div class="tabs" id="tabs"></div>
  <div class="row" style="margin-top:6px; flex-wrap:wrap">
    <button id="bSkip" class="small" title="Next portfolio without rating this one">Skip ⤼ <kbd>S</kbd></button>
    <button id="bLink" class="small" title="Their next link, if they gave several">Next link <kbd>L</kbd></button>
    <button id="bBack" class="small" title="Previous applicant (rating unchanged)">← Back <kbd>B</kbd></button>
    <button id="bUndo" class="small">↶ Undo <kbd>U</kbd></button>
    <button id="bHere" class="small" title="Review whichever row is selected in the sheet">Use selected row</button>
    <button id="bShort" class="small" title="Make a Shortlist tab: PEAK and Not bad applicants per category tab, with links">📋 Build shortlist</button>
  </div>

  <div style="margin-top:10px">
    <textarea id="noteInput" placeholder="Add a note… (Enter to save)"></textarea>
  </div>

  <div class="voice">
    <span class="dot" id="voiceDot" title="Voice remote"></span>
    <button id="bVoice">🎤 Open voice remote</button>
  </div>
  <div class="muted small" id="heard"></div>

  <div id="status"></div>

  <details>
    <summary>Voice commands</summary>
    <table class="cmds" id="cmdTable"></table>
  </details>

<script>
const CFG = <?!= clientConfig ?>;
const VIEW_NAME = 'prPortfolioViewer';

const state = {
  sheet: null,
  dir: 'down',
  view: 'tab',
  current: null,
  linkIndex: 0,
  remaining: 0,
  choices: [],
  undoStack: [],
  history: [],
  voiceSource: null,
  viewerWanted: false,   // set once the person opens the portfolio window
  tabs: [],              // category tabs: Layout, Character Design, Story…
  pending: [],           // tabs to copy the current applicant into when they're rated
  done: [],              // tabs the current applicant was copied into
  peek: null,            // the applicant after this one, ready to show the moment you rate
  navBusy: 0,            // a Back / go to / undo is on its way: ratings wait for it
  others: 0,             // other people reviewing this tab right now
  stats: null,           // today's numbers for this tab (everyone)
  times: [],             // when you rated, this session (for your pace)
  // Identifies this sidebar so a second reviewer skips what we're holding.
  sid: Math.random().toString(36).slice(2) + Date.now().toString(36),
};
let viewer = null;       // the portfolio tab / window
let queue = Promise.resolve();

const $ = (id) => document.getElementById(id);

/* ---------- server calls ---------- */
function run(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}
function enqueue(task) {
  queue = queue.then(task).catch((err) => {
    const msg = (err && err.message) || String(err);
    // Say short problems out loud (the reviewer is looking at the portfolio, not the sidebar).
    status(msg, true, { say: msg.length <= 110 ? msg : 'Something went wrong. Check the sidebar.' });
  });
  return queue;
}

/* ---------- commands (buttons, keys and voice all land here) ---------- */
const RATE_CMDS = { next: 1, good: 1, peak: 1, excellent: 1, na: 1, score: 1, option: 1 };
const NAV_CMDS = { undo: 1, back: 1, top: 1, bottom: 1, goto: 1, down: 1, up: 1 };
const opts = (extra) => Object.assign({ sid: state.sid }, extra || {});

// tab: a tab name from the Add to buttons. answer: the voice remote sent this as the answer to a question.
function command(cmd, arg, tab, answer) {
  // Window controls run straight away; ratings move on straight away and save in the background;
  // everything else that touches the sheet runs in order.
  if (cmd === 'open' || cmd === 'replay' || cmd === 'play') return openCurrent();
  if (cmd === 'link') return nextLink();
  if (cmd === 'pause') return;
  if (cmd === 'progress') return sayProgress();
  if (RATE_CMDS[cmd]) return rateNow(cmd, cmd === 'score' || cmd === 'option' ? arg : undefined);
  if (cmd === 'skip') return skipNow();
  if (NAV_CMDS[cmd]) state.navBusy++;
  return enqueue(async () => {
    try {
      switch (cmd) {
        case 'addto': return await addTo(arg, tab, answer);
        case 'removefrom': return removeFrom(arg, tab, answer);
        case 'note': return await addNote(arg);
        case 'undo': return await undo();
        case 'back': return await back();
        case 'goto': return await goTo(arg);
        case 'down': case 'up': return await setDir(cmd);
        case 'top': case 'bottom': return await jump(cmd);
        default: throw new Error('Unknown command: ' + cmd);
      }
    } finally {
      if (NAV_CMDS[cmd]) state.navBusy--;
    }
  });
}

// Everything a call sends back: counts, who else is reviewing, today's numbers, and what's next.
function absorb(res) {
  if (!res) return;
  if (typeof res.remaining === 'number') state.remaining = res.remaining;
  if (typeof res.others === 'number') state.others = res.others;
  if (res.stats) state.stats = res.stats;
  if (res.current && state.current && res.current.row === state.current.row) state.peek = res.peek || null;
  renderCard();
  renderProgress();
}

// Show what the server picked (and remember the one after it).
function land(res, msg) {
  absorb(res);
  show(res.current, msg);
  state.peek = res.peek || null;
}

function guessLabel(cmd, value) {
  if (cmd === 'na') return 'N/A';
  const byCmd = { next: 'next', good: 'good', peak: 'peak', excellent: 'peak' };
  let c = null;
  if (byCmd[cmd]) c = state.choices.find((x) => x.cmd === byCmd[cmd]);
  else if (cmd === 'score') c = state.choices[Number(value) - 1];
  else if (cmd === 'option') c = state.choices.find((x) => x.option === value);
  return c ? c.label : cmd;
}

// Instant next: show the next applicant now and save the rating in the background.
function rateNow(cmd, value) {
  // A Back / go to / undo is still on its way: wait for it so the rating lands on the right person.
  if (state.navBusy) return enqueue(async () => rateNow(cmd, value));
  const cur = state.current;
  if (!cur) { status('Nothing open to rate. Try “top” or “bottom”.', true, { say: 'Nothing open to rate.' }); return; }
  const showing = state.peek && state.peek.row !== cur.row ? state.peek : null;
  const pending = state.pending.slice();
  const label = guessLabel(cmd, value);
  pushHistory(cur.row);
  if (showing) show(showing, `${label} → ${cur.name} (saving…)`);
  else status(`Saving ${label} → ${cur.name}…`);
  enqueue(async () => {
    let res;
    try {
      res = await run('pr_rate', state.sheet, cur.row, cmd, state.dir, value === undefined ? null : value, pending, opts({ showing: showing ? showing.row : 0 }));
    } catch (err) {
      const m = (err && err.message) || String(err);
      status(`Couldn’t save ${label} for ${cur.name}: ${m} Say “back” to try again.`, true,
        { say: m.length <= 90 ? 'Couldn’t save that rating. ' + m : 'Couldn’t save that rating. Say back to try again.' });
      return;
    }
    pushUndo(res.undo);
    state.times.push(Date.now());
    const what = res.rated.reviewed === 'No' ? 'N/A' : res.rated.rating;
    const synced = res.synced && res.synced.length ? ` · rating updated in ${res.synced.join(', ')}` : '';
    const msg = `${what} → ${res.rated.name}${addedText(res.added)}${synced}`;
    if (!showing) return land(res, msg);
    if (state.current && state.current.row === showing.row) {
      if (res.changed) land(res, `${msg} · someone else has that one, moved on`);
      else { absorb(res); status(`${msg} · Now: ${state.current.name} (#${state.current.number || '?'}, row ${state.current.row})`); }
    } else {
      absorb(res);
    }
  });
}

function skipNow() {
  if (state.navBusy) return enqueue(async () => skipNow());
  const cur = state.current;
  if (!cur) { status('Nothing open to skip.', true, { say: 'Nothing open to skip.' }); return; }
  const showing = state.peek && state.peek.row !== cur.row ? state.peek : null;
  const pending = state.pending.slice();
  pushHistory(cur.row);
  if (showing) show(showing, `Skipped ${cur.name}`);
  enqueue(async () => {
    let note = '';
    if (pending.length) {
      // They asked for these tabs, so copy them even though they're skipping the rating.
      const add = await run('pr_addTo', state.sheet, cur.row, pending);
      pushUndo(add.undo);
      note = addedText(add.added);
    }
    const res = await run('pr_skip', state.sheet, cur.row, state.dir, opts({ showing: showing ? showing.row : 0 }));
    if (!showing) return land(res, `Skipped ${cur.name}${note}`);
    if (state.current && state.current.row === showing.row && res.changed) land(res, `Skipped ${cur.name}${note} · someone else has that one, moved on`);
    else { absorb(res); if (note) status(`Skipped ${cur.name}${note}`); }
  });
}

function pushUndo(u) {
  state.undoStack.push(u);
  if (state.undoStack.length > 25) state.undoStack.shift();
}

function addedText(added) {
  if (!added || !added.length) return '';
  return ' · added to ' + added.map((a) => a.tab + (a.updated ? ' (was already there, updated)' : '')).join(', ');
}

/* ---------- "add to …": copy the applicant into a category tab ---------- */
const TAB_WORDS = [
  [/\b(?:two|to|too|2)[\s-]*d\b/g, '2d'],
  [/\b(?:vis|viz|visual)[\s-]*dev(?:elopment)?\b/g, 'visdev'],
  [/\b(?:animation|animations|animator|animators|anime|animated)\b/g, 'anim'],
  [/\bprops\b/g, 'prop'],
  [/\b(?:storyboards?|storyboarding|storyboarder)\b/g, 'story'],
  [/\bcharacters\b/g, 'character'],
  [/\bcreatures\b/g, 'creature'],
  [/\blayouts\b/g, 'layout'],
  [/\b(?:promotional|promos)\b/g, 'promo'],
  [/\bdesigners?\b/g, 'design'],
];
function tabKey(text) {
  let t = ' ' + String(text || '').toLowerCase() + ' ';
  TAB_WORDS.forEach(([re, r]) => { t = t.replace(re, r); });
  return t.replace(/[^a-z0-9]/g, '');
}

// "character" → Character Design, "vis dev" → Visdev, "2D animation" → 2D ANIM …
function matchTab(text) {
  const k = tabKey(text).replace(/^the/, '').replace(/(?:tabs?|sheet)$/, '');
  if (!k) return { err: 'Say which tab, e.g. “add to layout”.', say: 'Which tab?', ask: true };
  const all = state.tabs.map((t) => ({ t, k: tabKey(t) }));
  let hits = all.filter((x) => x.k === k);
  if (!hits.length) hits = all.filter((x) => x.k.indexOf(k) === 0);
  if (!hits.length && k.length >= 4) hits = all.filter((x) => x.k.indexOf(k) !== -1 || k.indexOf(x.k) === 0);
  if (hits.length === 1) return { tab: hits[0].t };
  if (hits.length > 1) {
    const names = hits.map((h) => h.t);
    return { err: `Which tab: ${names.join(', ')}?`, say: `Which one: ${spokenList(names)}?`, ask: true, prompt: `Which one? ${names.join(' · ')}` };
  }
  return {
    err: `No tab called “${text}”. Tabs: ${state.tabs.join(', ') || 'none found'}.`,
    say: `I don't know a tab called ${text}. Which tab?`, ask: true, prompt: `Which tab? ${state.tabs.join(' · ')}`,
  };
}

function spokenList(names) {
  const n = names.map((x) => x.toLowerCase().replace(/\b2d\b/, '2D'));
  return n.length > 1 ? n.slice(0, -1).join(', ') + ', or ' + n[n.length - 1] : n[0];
}

// A tab name we couldn't place: ask out loud, and let the next thing said be the answer.
// If this already was an answer, say so once and stop, so stray talk can't keep it asking.
function askTab(cmd, m, answer) {
  if (answer) {
    status(m.err, true, { say: 'Still not sure which tab. Try again, like add to layout.' });
    return;
  }
  status(m.err, true, { say: m.say, ask: m.ask ? { cmd, prompt: m.prompt || 'Which tab?' } : null });
}

async function addTo(text, tabName, answer) {
  const cur = state.current;
  if (!cur) throw new Error('Nothing open.');
  const m = tabName ? { tab: tabName } : matchTab(text);
  if (m.err) return askTab('addto', m, answer);
  if (state.done.indexOf(m.tab) !== -1) { status(`${cur.name} is already in ${m.tab}.`); return; }
  if (!cur.reviewed) {
    // Not rated yet: copy when they are, so the copy has the rating in it.
    if (state.pending.indexOf(m.tab) === -1) state.pending.push(m.tab);
    renderTabs();
    status(`Will add ${cur.name} to ${state.pending.join(' + ')} when you rate them.`);
    return;
  }
  const res = await run('pr_addTo', state.sheet, cur.row, [m.tab]);
  pushUndo(res.undo);
  res.added.forEach((a) => state.done.push(a.tab));
  renderTabs();
  status(`Added ${cur.name}${addedText(res.added).replace(' · added', '')}`);
}

function removeFrom(text, tabName, answer) {
  const m = tabName ? { tab: tabName } : matchTab(text);
  if (m.err) return askTab('removefrom', m, answer);
  if (state.pending.indexOf(m.tab) !== -1) {
    state.pending = state.pending.filter((t) => t !== m.tab);
    renderTabs();
    status(`Won’t add them to ${m.tab}.`);
  } else if (state.done.indexOf(m.tab) !== -1) {
    status(`Already copied to ${m.tab}. Say “undo” to take it back out.`);
  } else {
    status(`They weren’t going into ${m.tab}.`);
  }
}

function toggleTab(tab) {
  if (state.pending.indexOf(tab) !== -1) return command('removefrom', null, tab);
  return command('addto', null, tab);
}

function renderTabs() {
  const box = $('tabs');
  box.innerHTML = '';
  if (!state.tabs.length) return;
  const c = state.current;
  const lbl = document.createElement('span');
  lbl.className = 'lbl';
  lbl.textContent = 'Add to:';
  box.appendChild(lbl);
  const roles = c ? tabKey(c.roles) : '';
  state.tabs.forEach((t) => {
    const b = document.createElement('button');
    const done = state.done.indexOf(t) !== -1;
    const pending = state.pending.indexOf(t) !== -1;
    b.textContent = (done ? '✓ ' : pending ? '+ ' : '') + t;
    b.className = done ? 'done' : pending ? 'pending' : (roles && roles.indexOf(tabKey(t)) !== -1 ? 'fit' : '');
    b.title = done ? 'Copied into this tab' : pending ? 'Will be copied when you rate them (click to cancel)' : 'Copy them into this tab when you rate them';
    b.disabled = !c || done;
    b.onclick = () => toggleTab(t);
    box.appendChild(b);
  });
}

function pushHistory(row) {
  state.history.push(row);
  if (state.history.length > 100) state.history.shift();
}

async function addNote(text) {
  const cur = state.current;
  if (!cur) throw new Error('No applicant open.');
  const t = String(text || '').trim();
  if (!t) return;
  const res = await run('pr_addNote', state.sheet, cur.row, t);
  if (state.current && state.current.row === res.row) {
    state.current.notes = res.notes;
    renderCard();
  }
  status(`Note added → ${cur.name}`);
}

async function undo() {
  const u = state.undoStack.pop();
  if (!u) throw new Error('Nothing to undo.');
  const res = await run('pr_undo', state.sheet, u, state.dir, opts());
  const took = res.removed && res.removed.length ? ` · also undone in ${res.removed.join(', ')}` : '';
  if (u.kind === 'add') {
    absorb(res);
    if (state.current && state.current.row === u.row) {
      state.done = state.done.filter((t) => res.removed.indexOf(t) === -1);
      renderTabs();
      status(`Undid “add to”${took.replace('also undone in', 'took them out of')}`);
    } else {
      land(res, `Undid “add to”${took.replace('also undone in', 'took them out of')}`);
    }
    return;
  }
  if (state.history[state.history.length - 1] === u.row) state.history.pop();
  state.times.pop();
  land(res, `Undid rating → ${res.current.name}${took}`);
}

async function back() {
  const cur = state.current;
  let row = state.history.pop();
  if (!row) {
    if (!cur) throw new Error('Nothing to go back to.');
    row = state.dir === 'up' ? cur.row + 1 : cur.row - 1;
  }
  if (row < 2) throw new Error('Already at the first applicant.');
  const res = await run('pr_rowAt', state.sheet, row, state.dir, opts());
  land(res, 'Back');
}

async function setDir(d) {
  state.dir = d === 'up' ? 'up' : 'down';
  renderCard();
  status(state.dir === 'down' ? 'Going top → bottom' : 'Going bottom → top');
  run('pr_setPref', 'dir', state.dir).catch(() => {});
  // The next applicant is different in the new direction.
  if (state.current) absorb(await run('pr_hold', state.sheet, state.current.row, state.dir, opts()));
}

async function jump(where) {
  const res = await run('pr_jump', state.sheet, where, opts());
  state.dir = res.dir;
  land(res, where === 'top' ? 'Jumped to the top' : 'Jumped to the bottom');
}

async function startHere() {
  const res = await run('pr_startHere', state.sheet, state.dir, opts());
  land(res, `Row ${res.current.row}`);
}

// "go to 722", "go to row 40", "go to Alyssa" (again for the next Alyssa).
async function goTo(text) {
  const cur = state.current;
  const res = await run('pr_goto', state.sheet, text, cur ? cur.row : 1, state.dir, opts());
  const f = res.found || {};
  const more = f.count > 1 ? ` (${f.index} of ${f.count} matches, say it again for the next)` : '';
  if (cur && cur.row !== res.current.row) pushHistory(cur.row);
  land(res, `Went to ${res.current.name}${more}`);
}

/* ---------- progress ---------- */
// Your pace: ratings per hour this session, not counting breaks longer than 5 minutes.
function pace() {
  const t = state.times;
  if (t.length < 3) return 0;
  let active = 0;
  for (let i = 1; i < t.length; i++) active += Math.min(t[i] - t[i - 1], 5 * 60000);
  return active > 0 ? (t.length - 1) / (active / 3600000) : 0;
}

function duration(hours, spoken) {
  const m = Math.max(1, Math.round(hours * 60));
  const h = Math.floor(m / 60);
  const r = m % 60;
  if (spoken) return h ? `${h} hour${h > 1 ? 's' : ''}${r ? ` and ${r} minutes` : ''}` : `${r} minutes`;
  return h ? `${h}h ${r}m` : `${r} min`;
}

function renderProgress() {
  const s = state.stats || { total: 0, by: {} };
  const order = state.choices.map((c) => c.label).concat(['N/A']);
  const parts = order.filter((l) => s.by[l]).map((l) => `${l} ${s.by[l]}`);
  Object.keys(s.by).forEach((l) => { if (order.indexOf(l) === -1) parts.push(`${l} ${s.by[l]}`); });
  $('progToday').textContent = `Today: ${s.total} reviewed${parts.length ? ' · ' + parts.join(' · ') : ''}`;
  const p = pace();
  $('progMe').textContent = p
    ? `You: ${state.times.length} this session · ${Math.round(p)}/hr · ${state.remaining} left ≈ ${duration(state.remaining / p)} at your pace`
    : `${state.remaining} left · your pace shows after a few ratings`;
  $('others').hidden = !state.others;
  $('others').textContent = `👥 ${state.others} other ${state.others > 1 ? 'people' : 'person'} reviewing now (you won’t get the same applicants)`;
}

// "progress": say where things stand.
function sayProgress() {
  run('pr_progress', state.sheet, opts()).then((r) => {
    absorb(r);
    const p = pace();
    const msg = `${state.remaining} left. ${state.stats.total} done today.` +
      (p ? ` At your pace, about ${duration(state.remaining / p, true)}.` : '') +
      (state.others ? ` ${state.others} other ${state.others > 1 ? 'people are' : 'person is'} reviewing too.` : '');
    status(msg, false, { say: msg });
  }).catch((err) => status((err && err.message) || String(err), true));
}

// Keep holding what we're showing while you look at a portfolio for a while.
setInterval(() => {
  if (!state.sheet || !state.current || state.navBusy) return;
  const row = state.current.row;
  run('pr_hold', state.sheet, row, state.dir, opts()).then((r) => { if (state.current && state.current.row === row) absorb(r); }).catch(() => {});
}, 3 * 60000);

/* ---------- the portfolio tab / window ---------- */
function currentUrl() {
  const c = state.current;
  if (!c) return noteUrl({ done: true });
  const l = c.links[state.linkIndex];
  if (l) return l.url;
  return noteUrl({ name: c.name, text: c.portfolio });
}

// The note page gets its text after "#", so nothing about the applicant is sent to a server.
function noteUrl(data) {
  return CFG.noteUrl + '#' + encodeURIComponent(JSON.stringify(data));
}

function viewerOpen() {
  try { return !!viewer && !viewer.closed; } catch (e) { return false; }
}

function features() {
  if (state.view !== 'popup') return '';
  const W = screen.availWidth || 1400;
  const H = screen.availHeight || 900;
  const L = screen.availLeft || 0;
  const T = screen.availTop || 0;
  return `popup,left=${L},top=${T},width=${Math.max(640, W - 420)},height=${H}`;
}

// Points the portfolio tab at url. Returns false if the browser needs a click first.
function showInViewer(url) {
  if (!url) return false;
  if (viewerOpen()) {
    try {
      viewer.location.replace(url);
      watchViewer();
      setViewerState(true);
      return true;
    } catch (e) { /* fall through and reopen */ }
  }
  let w = null;
  try { w = window.open(url, VIEW_NAME, features()); } catch (e) { w = null; }
  if (w) {
    viewer = w;
    watchViewer();
    setViewerState(true);
    return true;
  }
  setViewerState(false, 'blocked');
  return false;
}

// Some sites cut the link back to this sidebar. Notice that, so the next one can reopen.
let watchTimer = null;
function watchViewer() {
  clearTimeout(watchTimer);
  watchTimer = setTimeout(() => { if (!viewerOpen() && state.viewerWanted) setViewerState(false, 'lost'); }, 2500);
}

function setViewerState(open, why) {
  $('viewerDot').classList.toggle('on', open);
  const el = $('viewerState');
  $('bOpen').classList.toggle('attn', !open && state.viewerWanted);
  if (open) {
    el.classList.remove('err');
    el.textContent = state.view === 'popup'
      ? 'Portfolio window is open. Each rating opens the next portfolio there.'
      : 'Portfolio tab is open. Each rating opens the next portfolio there.';
  } else if (why === 'blocked') {
    el.classList.add('err');
    el.textContent = 'The browser wants a click: press “Open portfolio” (or O). To skip this step, allow pop-ups for docs.google.com (icon at the right of the address bar → Always allow).';
    tellVoice('Click “Open portfolio” in the sidebar to show this one.', true, { say: 'Click open portfolio in the sidebar to show this one.' });
  } else if (why === 'lost') {
    el.classList.remove('err');
    el.textContent = 'Lost track of the portfolio tab (it was closed, or that site cut the link). The next one opens in a new tab.';
  } else {
    el.classList.remove('err');
    el.textContent = 'Click “Open portfolio” once. After that, every rating opens the next portfolio in the same tab.';
  }
}

function openCurrent() {
  state.viewerWanted = true;
  const url = currentUrl();
  const ok = showInViewer(url);
  if (ok) { try { viewer.focus(); } catch (e) {} }
  return ok;
}

function nextLink() {
  const c = state.current;
  if (!c || c.links.length < 2) { status(c ? 'They only gave one link.' : 'Nothing open.'); return; }
  state.linkIndex = (state.linkIndex + 1) % c.links.length;
  renderLinks();
  status(`Link ${state.linkIndex + 1} of ${c.links.length}: ${c.links[state.linkIndex].label}`);
  if (state.viewerWanted) showInViewer(currentUrl());
}

function setView(v) {
  if (v === state.view) return;
  state.view = v;
  renderView();
  run('pr_setPref', 'view', v).catch(() => {});
  // This runs from a click, so the browser lets us reopen in the new style straight away.
  if (viewerOpen()) {
    try { viewer.close(); } catch (e) {}
    viewer = null;
    openCurrent();
  }
}

function renderView() {
  $('vTab').classList.toggle('on', state.view !== 'popup');
  $('vPopup').classList.toggle('on', state.view === 'popup');
}

/* ---------- rendering ---------- */
function show(info, msg) {
  const sameRow = state.current && info && state.current.row === info.row;
  state.current = info;
  state.peek = null;
  state.linkIndex = 0;
  if (!sameRow) { state.pending = []; state.done = []; }
  renderCard();
  renderTabs();
  const now = info ? `Now: ${info.name} (#${info.number || '?'}, row ${info.row})` : 'All done in this direction 🎉';
  let extra = '';
  if (info && !info.links.length) extra = ' · No portfolio link. Say “N/A” or “skip”.';
  else if (info && info.links[0].kind === 'instagram') extra = ' · No portfolio link, showing their Instagram.';
  status((msg ? `${msg} · ${now}` : now) + extra);
  if (state.viewerWanted) showInViewer(currentUrl());
}

function renderCard() {
  $('remaining').textContent = `${state.remaining} left`;
  $('dirDown').classList.toggle('on', state.dir === 'down');
  $('dirUp').classList.toggle('on', state.dir === 'up');
  const c = state.current;
  document.querySelectorAll('#rate button, #bSkip, #bLink').forEach((b) => { b.disabled = !c; });
  if (!c) {
    $('name').textContent = 'All caught up';
    $('meta').textContent = 'No unreviewed applicants left in this direction.';
    ['links', 'ptext', 'notes', 'about'].forEach((id) => { $(id).textContent = ''; });
    $('aboutBox').style.display = 'none';
    return;
  }
  $('name').textContent = c.name;
  const bits = [];
  if (c.number) bits.push(`#${c.number}`);
  bits.push(`Row ${c.row}`);
  if (c.roles) bits.push(c.roles);
  if (c.country) bits.push(c.country);
  if (c.reviewed || c.rating) bits.push(`Reviewed: ${c.reviewed || '–'}${c.rating ? ' · ' + c.rating.trim() : ''}`);
  $('meta').textContent = bits.join(' · ');
  renderLinks();
  // Show the cell's own words when it's more than a bare link (passwords, "see my insta", etc.).
  const onlyLinks = c.links.length && c.links.every((l) => l.kind === 'link') &&
    c.portfolio.split(/\s+/).filter(Boolean).length <= c.links.length;
  $('ptext').textContent = onlyLinks ? '' : (c.portfolio || '(portfolio cell is empty)');
  $('notes').textContent = c.notes || '';
  $('about').textContent = c.about || '';
  $('aboutBox').style.display = c.about ? '' : 'none';
}

function renderLinks() {
  const box = $('links');
  box.innerHTML = '';
  const c = state.current;
  if (!c) return;
  c.links.forEach((l, i) => {
    const a = document.createElement('a');
    a.href = l.url;
    a.textContent = (c.links.length > 1 ? `${i + 1}. ` : '') + l.label;
    a.title = l.url;
    if (i === state.linkIndex) a.className = 'cur';
    a.onclick = (e) => {
      e.preventDefault();
      state.linkIndex = i;
      renderLinks();
      state.viewerWanted = true;
      showInViewer(l.url);
    };
    box.appendChild(a);
  });
  if (c.instagram && !c.links.some((l) => l.url === c.instagram)) {
    const a = document.createElement('a');
    a.href = c.instagram;
    a.textContent = 'Instagram ↗';
    a.className = 'small';
    box.appendChild(a);
  }
}

function renderChoices() {
  const box = $('rate');
  box.innerHTML = '';
  const colour = { next: 'c-next', good: 'c-good', peak: 'c-peak' };
  state.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = colour[c.cmd] || '';
    b.innerHTML = '<span></span><small></small>';
    b.firstChild.textContent = c.label;
    b.lastChild.innerHTML = `${i + 1}${c.key ? ' · <kbd>' + c.key + '</kbd>' : ''}`;
    b.onclick = () => (c.cmd === 'option' ? command('option', c.option) : command(c.cmd));
    box.appendChild(b);
  });
  const na = document.createElement('button');
  na.className = 'c-na';
  na.innerHTML = 'N/A<small>No link · <kbd>X</kbd></small>';
  na.title = 'Reviewed? = No (no portfolio or a broken link)';
  na.onclick = () => command('na');
  box.appendChild(na);
  box.style.gridTemplateColumns = `repeat(${Math.min(4, state.choices.length + 1)}, 1fr)`;
  renderHelp();
}

function helpRows() {
  const say = { next: 'next / “not feeling it”', good: 'good / “not bad”', peak: 'peak' };
  const rows = state.choices.filter((c) => say[c.cmd]).map((c) => [say[c.cmd], `${c.label}, open the next portfolio`]);
  rows.push([state.choices.map((c, i) => i + 1).join(' / '), state.choices.map((c, i) => `${i + 1} = ${c.label}`).join(', ')]);
  rows.push(['N/A', 'Reviewed = No (no portfolio or a broken link), open next']);
  rows.push(['skip', 'Next portfolio without rating this one']);
  rows.push(['link', 'Their next link, if they gave several']);
  rows.push(['open', 'Show this portfolio again']);
  if (state.tabs.length) {
    rows.push(['add to …', `Also copy them into a tab when you rate them: ${state.tabs.join(', ')}. You can add more than one.`]);
    rows.push(['remove from …', 'Cancel an “add to” before rating']);
  }
  rows.push(['go to …', '“go to 722” (applicant #), “go to row 40”, or “go to Alyssa” (again for the next match)']);
  rows.push(['progress', 'How many are left, done today, and how long the rest will take']);
  rows.push(['notes …', 'Add a note (or say “notes”, pause, then the note)']);
  rows.push(['back', 'Previous applicant, rating unchanged']);
  rows.push(['undo', 'Revert the last rating and go back']);
  rows.push(['top / bottom', 'Jump to the first unreviewed applicant from that end']);
  rows.push(['descending / ascending', 'Work top → bottom / bottom → top']);
  return rows;
}

function renderHelp() {
  const t = $('cmdTable');
  t.innerHTML = '';
  helpRows().forEach(([a, b]) => {
    const tr = t.insertRow();
    tr.insertCell().textContent = a;
    tr.insertCell().textContent = b;
  });
}

/* ---------- status (also echoed to the voice remote) ---------- */
function status(msg, isErr, extra) {
  const s = $('status');
  s.textContent = msg;
  s.classList.toggle('err', !!isErr);
  tellVoice(msg, isErr, extra);
}

/* ---------- voice remote ---------- */
const VOICE_ORIGIN = (() => { try { return new URL(CFG.voiceUrl).origin; } catch (e) { return null; } })();

function openVoice() {
  if (!VOICE_ORIGIN) { status('Set voiceUrl in PR_CONFIG (see README).', true); return; }
  const W = screen.availWidth || 1400;
  const L = (screen.availLeft || 0) + Math.max(0, W - 400);
  const T = screen.availTop || 0;
  const w = window.open(CFG.voiceUrl, 'prVoiceRemote', `width=380,height=600,left=${L},top=${T}`);
  if (!w) status('Popup blocked — allow pop-ups for docs.google.com and try again.', true);
}

// extra: { say: 'words to speak', ask: { cmd, prompt } to take the next thing said as the answer, tone: 'error' }
function tellVoice(text, isErr, extra) {
  if (!state.voiceSource) return;
  const msg = Object.assign({ type: 'ar-status', text, isErr: !!isErr }, extra || {});
  if (!msg.ask) delete msg.ask;
  try { state.voiceSource.postMessage(msg, VOICE_ORIGIN); } catch (e) {}
}

function ackVoice(source) {
  try {
    source.postMessage({
      type: 'ar-ack',
      title: $('title').textContent,
      app: 'portfolio',
      heading: '🎨 Portfolio voice remote',
      hint: 'Say “next”, “not bad”, “peak”, “add to layout”, “skip”, “N/A” or “notes …”',
      tip: 'Keep this window beside the portfolio, not behind it. Headphones aren’t needed here.',
      help: helpRows(),
    }, VOICE_ORIGIN);
  } catch (err) {}
}

window.addEventListener('message', (e) => {
  if (!VOICE_ORIGIN || e.origin !== VOICE_ORIGIN) return;
  const d = e.data || {};
  if (d.type === 'ar-hello') {
    state.voiceSource = e.source;
    $('voiceDot').classList.add('on');
    ackVoice(e.source);
    return;
  }
  if (d.type === 'ar-command' && typeof d.cmd === 'string') {
    state.voiceSource = e.source;
    $('voiceDot').classList.add('on');
    $('heard').textContent = `Heard: “${d.heard || d.cmd}”`;
    command(d.cmd, d.cmd === 'score' ? d.value : d.text, null, !!d.answer);
  }
});

/* ---------- wiring ---------- */
$('bOpen').onclick = openCurrent;
$('vTab').onclick = () => setView('tab');
$('vPopup').onclick = () => setView('popup');
$('bSkip').onclick = () => command('skip');
$('bLink').onclick = () => command('link');
$('bUndo').onclick = () => command('undo');
$('bBack').onclick = () => command('back');
$('dirDown').onclick = () => command('down');
$('dirUp').onclick = () => command('up');
$('bHere').onclick = () => { state.navBusy++; enqueue(async () => { try { await startHere(); } finally { state.navBusy--; } }); };
$('bShort').onclick = () => enqueue(async () => {
  status('Building the shortlist…');
  const r = await run('pr_buildShortlist');
  status(`Shortlist tab updated: ${r.summary}`);
});
$('bVoice').onclick = openVoice;

function submitNote() {
  const t = $('noteInput').value.trim();
  if (!t) return;
  $('noteInput').value = '';
  command('note', t);
}

document.addEventListener('keydown', (e) => {
  if (e.target.matches('textarea, input')) {
    if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'noteInput') { e.preventDefault(); submitNote(); }
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { n: 'next', g: 'good', p: 'peak', x: 'na', s: 'skip', l: 'link', b: 'back', u: 'undo', o: 'open' };
  const k = e.key.toLowerCase();
  if (map[k]) { e.preventDefault(); command(map[k]); }
  else if (/^[1-9]$/.test(k) && Number(k) <= state.choices.length) { e.preventDefault(); command('score', Number(k)); }
});

state.navBusy++;
enqueue(async () => {
  let res;
  try { res = await run('pr_init', opts()); } finally { state.navBusy--; }
  state.sheet = res.sheetName;
  state.dir = res.dir;
  state.view = res.view;
  state.remaining = res.remaining;
  state.choices = res.choices;
  state.tabs = res.tabs || [];
  $('title').textContent = res.title;
  renderView();
  renderChoices();
  land(res, res.sheetName);
});
</script>
</body>
</html>
